<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-g" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Senhas</title>
    <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.24.0"
  }
}
</script>
<style>
  body {
    background-color: #02000f;
    margin: 0;
    padding: 0;
    overflow: hidden;
    color: white;
  }

  .animated-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    overflow: hidden;
  }

  .animated-background::before,
  .animated-background::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 200vmax;
    height: 200vmax;
    background-repeat: repeat;
    mix-blend-mode: screen;
    animation: 20s linear infinite;
  }

  .animated-background::before {
    background-image:
      radial-gradient(circle at center, rgba(255, 0, 150, 0.4) 0, transparent 40%),
      repeating-conic-gradient(from 0deg, #ff0096 0%, #00f 10%, #0f0 20%, #ff0 30%, #f00 40%, #0ff 50%, #f0f 60%, #00f 70%, #0ff 80%, #f00 90%, #ff0096 100%);
    background-size: 100% 100%, 50% 50%;
    animation-name: vortex;
    transform-origin: center;
    opacity: 0.6;
  }

  .animated-background::after {
    background-image:
      radial-gradient(circle at center, white 0, transparent 20%);
    background-size: 100% 100%;
    animation-name: pulse;
    transform-origin: center;
    opacity: 0.2;
    animation-duration: 5s;
    animation-timing-function: ease-in-out;
  }

  @keyframes vortex {
    from { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
    to { transform: translate(-50%, -50%) rotate(360deg) scale(1.1); }
  }

  @keyframes pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.2; }
    50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.4; }
  }

  #root {
    position: relative;
    z-index: 1;
  }

  /* Optional: subtle scan lines effect */
  body::after {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0) 0, rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0.1) 3px, rgba(0, 0, 0, 0.1) 4px);
    z-index: 0;
    pointer-events: none;
  }
</style>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div class="animated-background"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
